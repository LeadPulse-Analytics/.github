<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">LeadPulse Analytics</title>
<desc id="desc">A refined dark brand banner for digital activation and revenue operations.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0c1020"/>
    <stop offset=".57" stop-color="#17152b"/>
    <stop offset="1" stop-color="#2b111f"/>
  </linearGradient>
  <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#6d28d9"/>
    <stop offset=".52" stop-color="#a855f7"/>
    <stop offset="1" stop-color="#ff3e57"/>
  </linearGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
    <path d="M34 0H0V34" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="1"/>
  </pattern>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#ff3e57" stop-opacity=".19"/>
    <stop offset="1" stop-color="#ff3e57" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1200" height="300" rx="22" fill="url(#bg)"/>
<rect width="1200" height="300" rx="22" fill="url(#grid)"/>
<ellipse cx="1000" cy="150" rx="255" ry="190" fill="url(#glow)"/>
<path d="M70 55V245" stroke="url(#brand)" stroke-width="5" stroke-linecap="round"/>
<text x="104" y="128" fill="#fff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="760" letter-spacing="1.8">LEADPULSE</text>
<text x="108" y="159" fill="#c3b5ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="650" letter-spacing="8">ANALYTICS</text>
