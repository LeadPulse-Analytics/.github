<text x="107" y="216" fill="#eeeaf7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" letter-spacing=".3">Ativação digital · Operações de receita</text>
<text x="107" y="244" fill="#89889a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2">PRODUCT SYSTEMS THAT CONNECT CUSTOMER JOURNEYS TO OPERATIONS</text>
