<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Davi — Product Engineering</title>
<desc id="desc">A dark indigo technical banner with a connected systems motif and violet and coral highlights.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1020"/>
    <stop offset=".58" stop-color="#15132a"/>
    <stop offset="1" stop-color="#25122c"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8b5cf6"/>
    <stop offset="1" stop-color="#ff4d5a"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".22"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#d8d7ff" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
</defs>
<rect width="1200" height="300" rx="22" fill="url(#bg)"/>
