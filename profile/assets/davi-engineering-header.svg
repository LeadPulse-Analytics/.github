<ellipse cx="968" cy="149" rx="248" ry="202" fill="url(#halo)"/>
<rect x="66" y="54" width="4" height="190" rx="2" fill="url(#accent)"/>
<text x="100" y="126" fill="#f8f7ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="57" font-weight="760" letter-spacing="-2">Davi</text>
<text x="103" y="163" fill="#c6b5ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3">FOUNDER · PRODUCT ENGINEERING</text>
<text x="103" y="202" fill="#c7c7d4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" letter-spacing=".3">Digital products, automation, and revenue systems.</text>
<text x="103" y="231" fill="#84869a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="2">DESIGN WITH INTENT · BUILD FOR OPERATIONS · MEASURE WHAT MATTERS</text>
